log:
  level: info
  format: json
postgres:
  host: localhost
  port: 55433
  database: imageprocessor
  max_conns: 10
  timeout: 5s
minio:
  endpoint: localhost:9000
  bucket: images
  secure: false
  timeout: 5s
kafka:
  brokers: [localhost:29092]
  jobs_topic: image.processing.jobs
  dlq_topic: image.processing.dlq
  consumer_group: image-processor-workers
  timeout: 10s
