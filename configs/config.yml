log:
  level: info
  format: json
postgres:
  host: localhost
  port: 55433
  database: imageprocessor
  max_conns: 10
  timeout: 5s
minio:
  endpoint: localhost:9000
  bucket: images
  secure: false
  timeout: 5s
kafka:
  brokers: [localhost:29092]
  jobs_topic: image.processing.jobs
  dlq_topic: image.processing.dlq
  consumer_group: image-processor-workers
  timeout: 10s
http:
  address: :8080
  read_header_timeout: 5s
  read_timeout: 60s
  write_timeout: 120s
  idle_timeout: 60s
  shutdown_timeout: 30s
startup_timeout: 30s
validation_concurrency: 1
migrations_dir: migrations
