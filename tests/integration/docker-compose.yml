# Start: docker compose --env-file /dev/null -f tests/integration/docker-compose.yml up -d --wait
# Test: go test -race -tags=integration ./tests/integration
# Stop: docker compose --env-file /dev/null -f tests/integration/docker-compose.yml down
name: imageprocessor-postgres-test
services:
  postgres:
    image: postgres:18.7-bookworm@sha256:e742a2668255221388004f3a42b6150a2103f5054ab3a4a93ae9e4f01e551c35
    environment:
      POSTGRES_DB: imageprocessor_test
      POSTGRES_USER: ${TEST_POSTGRES_USER:-imageprocessor_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-integration-only-password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55434}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d imageprocessor_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    build:
      context: ../..
      dockerfile: Dockerfile.minio
    image: imageprocessor-minio:local
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_ACCESS_KEY:-integration-user}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_SECRET_KEY:-integration-password}
    ports:
      - "127.0.0.1:${TEST_MINIO_PORT:-59000}:9000"
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    environment:
      CLUSTER_ID: VGVzdEltYWdlUHJvY2Vzcw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${TEST_KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Avoid the image's anonymous /var/lib/kafka/data mount.
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${TEST_KAFKA_PORT:-59092}:9094"
    tmpfs:
      - /var/lib/kafka:uid=1000,gid=1000,mode=0755
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 5s
      timeout: 10s
      retries: 30
