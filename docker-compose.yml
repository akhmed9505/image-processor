name: imageprocessor
x-app: &app
  image: imageprocessor-app:local
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
    POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-5s}
    MINIO_ENDPOINT: minio:9000
    MINIO_BUCKET: ${MINIO_BUCKET:-images}
    MINIO_SECURE: "false"
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    MINIO_TIMEOUT: ${MINIO_TIMEOUT:-5s}
    KAFKA_BROKERS: kafka:9092
    KAFKA_JOBS_TOPIC: ${KAFKA_JOBS_TOPIC:-image.processing.jobs}
    KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-image.processing.dlq}
    KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-image-processor-workers}
    KAFKA_TIMEOUT: ${KAFKA_TIMEOUT:-10s}
    HTTP_ADDRESS: :8080
    HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
    HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-60s}
    HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-120s}
    HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
    HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
    STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-30s}
    VALIDATION_CONCURRENCY: ${VALIDATION_CONCURRENCY:-1}
    MIGRATIONS_DIR: migrations
services:
  migrate:
    <<: *app
    command: ["server", "-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  server:
    <<: *app
    command: ["server"]
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    stop_grace_period: 60s
    depends_on: &application-dependencies
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/images?limit=1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  worker:
    <<: *app
    command: ["worker"]
    stop_grace_period: 60s
    depends_on: *application-dependencies
    # Consumer liveness; infrastructure readiness is gated by depends_on.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
  postgres:
    image: postgres:18.7-bookworm@sha256:e742a2668255221388004f3a42b6150a2103f5054ab3a4a93ae9e4f01e551c35
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    image: imageprocessor-minio:local
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    environment:
      CLUSTER_ID: SW1hZ2VQcm9jZXNzb3JLMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Avoid the image's anonymous /var/lib/kafka/data mount.
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:9094"
    volumes:
      - kafka-data:/var/lib/kafka
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  kafka-data:
  minio-data:
  postgres-data:
